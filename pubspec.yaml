name: portfolio_project
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_animate: ^4.5.0
  url_launcher: ^6.3.0
  go_router: ^14.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/

  fonts:
    - family: regular
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf

    - family: bold
      fonts:
        - asset: assets/fonts/Sans-Bold.ttf
